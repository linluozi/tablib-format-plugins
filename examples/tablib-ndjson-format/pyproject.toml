[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tablib-ndjson-format"
version = "1.0.0"
description = "Newline-delimited JSON format for tablib, delivered as a tablib plugin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tablib>=3.9"]

[project.entry-points."tablib.formats"]
ndjson = "tablib_ndjson_format:NDJSONFormat"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
